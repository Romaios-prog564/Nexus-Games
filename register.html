<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — NEXUS GAMES</title>
  <link rel="stylesheet" href="auth.css" />

<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
  
</head>
<body>
  <div class="auth-bg"></div>
  <div class="grid-overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="index.html">⬡ NEXUS GAMES</a>
        <p>Mini Game Hub</p>
      </div>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join the arena today</p>

      <div id="error-msg" class="error-msg"></div>
      <div id="success-msg" class="success-msg"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username (min 3 chars)" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password (min 4 chars)" autocomplete="new-password" required />
          <div class="password-strength">
            <div class="strength-bar" id="strength-bar"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn-submit"><span>CREATE ACCOUNT</span></button>
      </form>

      <div class="divider">OR</div>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    Auth.redirectIfLoggedIn();
    initParticles('particles-canvas');

    // Password strength meter
    document.getElementById('password').addEventListener('input', function() {
      const pw = this.value;
      const bar = document.getElementById('strength-bar');
      let strength = 0;
      if (pw.length >= 4) strength += 25;
      if (pw.length >= 8) strength += 25;
      if (/[A-Z]/.test(pw) || /[0-9]/.test(pw)) strength += 25;
      if (/[^A-Za-z0-9]/.test(pw)) strength += 25;
      bar.style.width = strength + '%';
      bar.style.background = strength <= 25 ? '#ff4466' : strength <= 50 ? '#ffaa00' : strength <= 75 ? '#00f5ff' : '#00ff88';
    });

    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const errEl = document.getElementById('error-msg');
      const sucEl = document.getElementById('success-msg');
      errEl.classList.remove('show');
      sucEl.classList.remove('show');

      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.add('show');
        return;
      }

      const result = Auth.register(username, password);
      if (result.success) {
        sucEl.textContent = '✓ Account created! Logging you in...';
        sucEl.classList.add('show');
        // Auto-login after register
        Auth.login(username, password);
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
      } else {
        errEl.textContent = result.error;
        errEl.classList.add('show');
      }
    });
  </script>
</body>
</html>
