<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — NEXUS GAMES</title>
  <link rel="stylesheet" href="auth.css" />

<link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
<link rel="shortcut icon" href="/favicon.ico?v=2" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
<meta name="apple-mobile-web-app-title" content="NXS-Games" />
<link rel="manifest" href="/site.webmanifest?v=2" />

</head>
<body>
  <div class="auth-bg"></div>
  <div class="grid-overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="index.html">⬡ NEXUS GAMES</a>
        <p>Mini Game Hub</p>
      </div>

      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Enter your credentials to continue</p>

      <div id="error-msg" class="error-msg"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-submit"><span>ACCESS HUB</span></button>
      </form>

      <div class="divider">OR</div>

      <p class="auth-footer">
        No account? <a href="register.html">Register here</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    Auth.redirectIfLoggedIn();
    initParticles('particles-canvas');

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error-msg');
      errEl.classList.remove('show');

      const result = Auth.login(username, password);
      if (result.success) {
        // Flash success then redirect
        document.querySelector('.auth-card').style.transition = 'all 0.4s';
        document.querySelector('.auth-card').style.transform = 'scale(0.95)';
        document.querySelector('.auth-card').style.opacity = '0';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 400);
      } else {
        errEl.textContent = result.error;
        errEl.classList.add('show');
      }
    });
  </script>
</body>
</html>
