<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS GAMES — Mini Game Hub</title>
  <link rel="stylesheet" href="main.css" />

  <link rel="icon" type="image/png" href="favicon-96x96.png?v=3" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
  <link rel="icon" href="favicon.ico" type="image/x-icon?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="NXS-Games" />
  <link rel="manifest" href="site.webmanifest?v=3" />

</head>
<body>
  <div class="bg-gradient"></div>
  <div class="grid-overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <!-- Floating orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-logo" href="index.html">⬡ NEXUS</a>
    <div class="navbar-right" id="nav-right">
      <!-- Filled by JS -->
    </div>
  </nav>

  <!-- Hero -->
  <main class="hero">
    <div class="hero-title">NEXUS<br/>GAMES</div>
    <p class="hero-subtitle">Your Gateway to the Digital Arena</p>
    <div class="hero-buttons" id="hero-buttons">
      <!-- Filled by JS -->
    </div>
  </main>

  <footer>
    <p>⬡ Nexus Games &nbsp;|&nbsp; Safe for playing &nbsp;|&nbsp; Made with ❤️</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initParticles('particles-canvas');
      const user = Auth.getCurrentUser();
      const navRight = document.getElementById('nav-right');
      const heroButtons = document.getElementById('hero-buttons');

      if (user) {
        navRight.innerHTML = `
          <div class="user-badge"><span class="dot"></span>${user.username}</div>
          <a href="dashboard.html" class="btn btn-primary">DASHBOARD</a>
          <button onclick="Auth.logout()" class="btn btn-outline">LOGOUT</button>
        `;
        heroButtons.innerHTML = `
          <a href="dashboard.html" class="btn btn-primary">▶ ENTER HUB</a>
        `;
      } else {
        navRight.innerHTML = `
          <a href="login.html" class="btn btn-outline">LOGIN</a>
          <a href="register.html" class="btn btn-primary">REGISTER</a>
        `;
        heroButtons.innerHTML = `
          <a href="register.html" class="btn btn-primary">▶ GET STARTED</a>
          <a href="login.html" class="btn btn-outline">LOGIN</a>
        `;
      }
    });
  </script>
</body>
</html>
