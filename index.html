<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="keywords" content="mini games website, browser games, HTML5 games, game hub, free online games, vanilla javascript games, interactive website, neon UI">
    <meta name="description" content="A modern mini-game hub with 3 interactive browser games, login system, and beautiful animated UI. Play instantly with no downloads.">
    <meta name="author" content="Romaios"
    
  <title>NEXUS GAMES — Mini Game Hub</title>
  <link rel="stylesheet" href="main.css" />

<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

</head>
<body>
  <div class="bg-gradient"></div>
  <div class="grid-overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <!-- Floating orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-logo" href="index.html">⬡ NEXUS</a>
    <div class="navbar-right" id="nav-right">
      <!-- Filled by JS -->
    </div>
  </nav>

  <!-- Hero -->
  <main class="hero">
    <div class="hero-title">NEXUS<br/>GAMES</div>
    <p class="hero-subtitle">Your Gateway to the Digital Arena</p>
    <div class="hero-buttons" id="hero-buttons">
      <!-- Filled by JS -->
    </div>
  </main>

  <footer>
    <p>⬡ NEXUS GAMES &nbsp;|&nbsp; PURE VANILLA JS &nbsp;|&nbsp; NO FRAMEWORKS</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initParticles('particles-canvas');
      const user = Auth.getCurrentUser();
      const navRight = document.getElementById('nav-right');
      const heroButtons = document.getElementById('hero-buttons');

      if (user) {
        navRight.innerHTML = `
          <div class="user-badge"><span class="dot"></span>${user.username}</div>
          <a href="dashboard.html" class="btn btn-primary">DASHBOARD</a>
          <button onclick="Auth.logout()" class="btn btn-outline">LOGOUT</button>
        `;
        heroButtons.innerHTML = `
          <a href="dashboard.html" class="btn btn-primary">▶ ENTER HUB</a>
        `;
      } else {
        navRight.innerHTML = `
          <a href="login.html" class="btn btn-outline">LOGIN</a>
          <a href="register.html" class="btn btn-primary">REGISTER</a>
        `;
        heroButtons.innerHTML = `
          <a href="register.html" class="btn btn-primary">▶ GET STARTED</a>
          <a href="login.html" class="btn btn-outline">LOGIN</a>
        `;
      }
    });
  </script>
</body>
</html>
